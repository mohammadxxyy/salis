<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Google Gradients -->
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#D93025" />
    </linearGradient>
    <linearGradient id="gYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#F9AB00" />
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#1E8E3E" />
    </linearGradient>
    
    <!-- Material Shadows -->
    <filter id="mDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background App Squircle Tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#FFFFFF" filter="url(#mDrop)" />

  <g transform="translate(256, 256)">
    <!-- Blue Loop (First tooth of "س" & left folder wing) -->
    <path d="M -130,-40 C -130,-95 -85,-140 -30,-140 C 15,-140 50,-110 50,-70 C 50,-30 15,0 -25,0 C -65,0 -95,-25 -95,-60" 
          fill="none" stroke="url(#gBlue)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Red Arc (Center loop & spine) -->
    <path d="M -25,0 C 20,0 60,-35 60,-80 C 60,-125 105,-155 150,-125 C 185,-100 185,-50 150,-10 C 120,25 75,55 20,55" 
          fill="none" stroke="url(#gRed)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Yellow Wing (Right flow & folder flap) -->
    <path d="M 20,55 C -35,55 -90,95 -90,145 C -90,185 -55,205 -10,205 C 45,205 100,165 140,120" 
          fill="none" stroke="url(#gYellow)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Green Base Ribbon (Foundation & bookmark flow) -->
    <path d="M -140,110 C -100,110 -60,140 -20,160 C 25,182 75,185 125,160 C 155,145 175,120 180,90" 
          fill="none" stroke="url(#gGreen)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Accent: Google Gemini Sparkle Dot -->
    <circle cx="20" cy="-25" r="14" fill="#4285F4" />
  </g>
</svg>
