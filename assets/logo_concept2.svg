<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c2Blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1967D2" />
    </linearGradient>
    <linearGradient id="c2Red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#C5221F" />
    </linearGradient>
    <linearGradient id="c2Yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#F29900" />
    </linearGradient>
    <linearGradient id="c2Green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#188038" />
    </linearGradient>

    <filter id="c2Shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- App Tile Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#FFFFFF" filter="url(#c2Shadow)" />

  <g transform="translate(68, 88)">
    <!-- Back Folder Body (Google Blue) -->
    <path d="M 40,80 L 140,80 Q 155,80 168,92 L 200,124 Q 212,136 228,136 L 336,136 Q 360,136 360,160 L 360,280 Q 360,304 336,304 L 40,304 Q 16,304 16,280 L 16,104 Q 16,80 40,80 Z" 
          fill="url(#c2Blue)" />

    <!-- Red Folder Tab Accent -->
    <path d="M 40,80 L 140,80 Q 155,80 168,92 L 200,124 Q 212,136 228,136 L 250,136 L 250,96 Q 250,80 234,80 L 40,80 Z" 
          fill="url(#c2Red)" />

    <!-- Inner Academic Document (Google Yellow) with folded corner -->
    <path d="M 100,56 L 260,56 Q 276,56 288,68 L 316,96 Q 328,108 328,124 L 328,260 Q 328,272 316,272 L 100,272 Q 88,272 88,260 L 88,68 Q 88,56 100,56 Z" 
          fill="url(#c2Yellow)" filter="url(#innerGlow)" />
    <!-- White document text stripes -->
    <rect x="124" y="140" width="120" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />
    <rect x="124" y="168" width="150" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />
    <rect x="124" y="196" width="90" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />

    <!-- Front Folder Flap (Google Green) angled forward -->
    <path d="M 24,312 L 340,312 Q 360,312 366,292 L 388,188 Q 394,168 374,168 L 130,168 Q 112,168 104,180 L 14,292 Q 4,312 24,312 Z" 
          fill="url(#c2Green)" filter="url(#innerGlow)" />

    <!-- Sleek Arabic "س" crest embossed on front flap -->
    <path d="M 140,256 Q 160,230 180,256 Q 200,230 220,256 Q 240,270 260,250" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.95" />
  </g>
</svg>
